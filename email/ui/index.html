<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src 'self' about:; form-action 'none'; base-uri 'none'">
<title>E-mail</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <!-- Contas e pastas -->
    <nav id="nav">
      <div class="nav-head">
        <button id="nav-toggle" class="nav-toggle" title="Recolher menu" aria-label="Recolher menu" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="m15 10-2 2 2 2" class="chev"/></svg>
        </button>
        <button id="compose" class="primary" title="Escrever (C)">
          <span class="ico" aria-hidden="true">✎</span><span class="txt">Escrever</span>
        </button>
      </div>

      <div class="section-title"><span class="st-text">Pastas</span></div>
      <ul id="folders"></ul>
    </nav>

    <!-- Lista de mensagens -->
    <section id="list-pane">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Buscar e-mails" title="Busca em assunto, remetente e destinatários" autocomplete="off" spellcheck="false">
        <button id="mark-all-read" class="icon" title="Marcar tudo como lido" aria-label="Marcar tudo como lido"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12.5l4.5 4.5L15 8.5"/><path d="M11 16l1 1 9.5-9.5"/></svg></button>
        <button id="refresh" class="icon" title="Sincronizar agora" aria-label="Sincronizar agora">⟳</button>
      </div>
      <div class="chips">
        <button class="chip" data-filter="unread">Não lidas</button>
        <button class="chip" data-filter="read" title="Só as lidas, ainda separadas por Importante, Propaganda e Outros">Lidas</button>
        <button class="chip" data-filter="flagged">Favoritas</button>
        <button class="chip" data-filter="attachments">Com anexo</button>
        <button class="chip" data-filter="threads" title="Agrupar mensagens da mesma conversa">Conversas</button>
        <button class="chip" data-filter="priority" title="Só as mensagens com pontuação de relevância acima do limiar (aprende com os botões Importante / Não importante)">★ Prioritários</button>
      </div>
      <div id="prio-bar" hidden>
        <label for="prio-th">Limiar</label>
        <input id="prio-th" type="range" min="0" max="100" step="5" aria-describedby="prio-th-val">
        <span id="prio-th-val" class="muted small"></span>
      </div>
      <div id="banner" hidden></div>
      <ul id="messages" tabindex="0" aria-label="Mensagens"></ul>
      <!-- Caixa de entrada: grupos virtuais (Importante, Propaganda, Outros, Suspeitos, Já lidos), só no app -->
      <div id="empty" hidden></div>
    </section>

    <!-- Leitura -->
    <section id="reader">
      <div id="reader-empty" class="placeholder">Selecione uma mensagem</div>
      <div id="thread" hidden>
        <div class="r-toolbar">
          <button class="tb" data-act="archive" title="Arquivar (E)">Arquivar</button>
          <button class="tb" data-act="trash" title="Excluir (#)">Excluir</button>
          <button class="tb" data-act="spam" title="Spam (!)">Spam</button>
          <button class="tb" data-act="unread" title="Marcar como não lida (U)">Não lida</button>
          <button class="tb" data-act="star" title="Favoritar (S)">☆ Favoritar</button>
          <button class="tb" data-act="move" title="Mover para outra pasta">Mover ▾</button>
          <span class="tb-sep" aria-hidden="true"></span>
          <button class="tb prio" data-prio="1" aria-pressed="false" title="Soma 10 pontos à relevância e ensina o que é importante (clique de novo para desfazer)">★ Importante</button>
          <button class="tb prio" data-prio="-1" aria-pressed="false" title="Tira 10 pontos da relevância e ensina o que não é importante (clique de novo para desfazer)">Não importante</button>
        </div>
        <div class="t-head">
          <h1 id="t-subject"></h1>
          <span id="t-count" class="muted small"></span>
        </div>
        <div id="t-messages"></div>
        <div class="t-replybar">
          <button class="tb" data-act="reply" title="Responder (R)">↩ Responder</button>
          <button class="tb" data-act="replyAll" title="Responder a todos (A)">↩↩ Responder a todos</button>
          <button class="tb" data-act="forward" title="Encaminhar (F)">↪ Encaminhar</button>
        </div>
        <div id="t-prio" class="muted small" hidden></div>
      </div>
    </section>

    <!-- Escrever / responder (ocupa a coluna de leitura) -->
    <section id="composer" hidden aria-label="Escrever e-mail">
      <div class="cp-head">
        <h2 id="cp-title">Nova mensagem</h2>
        <span id="cp-status" class="muted small"></span>
        <span class="spacer"></span>
        <button class="cp-x" id="cp-close" title="Fechar (o rascunho fica salvo)" aria-label="Fechar">✕</button>
      </div>
      <div class="cp-fields">
        <div class="cp-row"><label for="cp-from">De</label><select id="cp-from"></select></div>
        <div class="cp-row"><label for="cp-to">Para</label>
          <input id="cp-to" class="rcpt" autocomplete="off" spellcheck="false" placeholder="nome@exemplo.com, outro@exemplo.com">
          <button type="button" class="link" id="cp-show-cc">Cc/Cco</button></div>
        <div class="cp-row" id="cp-cc-row" hidden><label for="cp-cc">Cc</label>
          <input id="cp-cc" class="rcpt" autocomplete="off" spellcheck="false"></div>
        <div class="cp-row" id="cp-bcc-row" hidden><label for="cp-bcc" title="Cópia oculta: os outros não veem">Cco</label>
          <input id="cp-bcc" class="rcpt" autocomplete="off" spellcheck="false"></div>
        <div class="cp-row"><label for="cp-subject">Assunto</label><input id="cp-subject" autocomplete="off"></div>
      </div>
      <div class="cp-toolbar" role="toolbar" aria-label="Formatação">
        <button type="button" data-cmd="bold" title="Negrito (Ctrl+B)"><b>N</b></button>
        <button type="button" data-cmd="italic" title="Itálico (Ctrl+I)"><i>I</i></button>
        <button type="button" data-cmd="underline" title="Sublinhado (Ctrl+U)"><u>S</u></button>
        <span class="sep"></span>
        <button type="button" data-cmd="insertUnorderedList" title="Lista">•≡</button>
        <button type="button" data-cmd="insertOrderedList" title="Lista numerada">1≡</button>
        <button type="button" data-cmd="link" title="Inserir link">🔗</button>
        <button type="button" data-cmd="removeFormat" title="Limpar formatação">⌫</button>
        <span class="sep"></span>
        <button type="button" id="cp-attach" title="Anexar arquivos">📎 Anexar</button>
        <input type="file" id="cp-file" multiple hidden>
      </div>
      <div class="cp-paper"><div id="cp-editor" contenteditable="true" spellcheck="true" aria-label="Mensagem"></div></div>
      <div id="cp-atts" class="cp-atts" hidden></div>
      <div class="cp-foot">
        <button class="primary" id="cp-send" title="Enviar (Ctrl+Enter)">Enviar</button>
        <span class="muted small">Ctrl+Enter</span>
        <span class="spacer"></span>
        <button class="tb" id="cp-discard" title="Descartar e apagar o rascunho">🗑 Descartar</button>
      </div>
      <div id="cp-drop" hidden>Solte os arquivos para anexar</div>
    </section>
  </div>

  <div id="suggest" class="menu suggest" hidden role="listbox"></div>

  <div id="toast" hidden role="status"></div>

  <!-- Menus (conta, mover, menu de contexto da mensagem) -->
  <div id="menu" class="menu" hidden role="menu"></div>

  <!-- Diálogos (adicionar/editar conta e o agente de triagem ficam em Configurações › E-mail) -->
  <div id="overlay" hidden>
    <div class="dialog" id="dlg-confirm" hidden>
      <h2 id="confirm-title"></h2>
      <p class="muted" id="confirm-text"></p>
      <div class="row">
        <button class="secondary" id="confirm-no">Cancelar</button>
        <button class="danger" id="confirm-yes">Confirmar</button>
      </div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
