<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sem conexão</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f6fb;color:#1f2d3d;display:flex;
       align-items:center;justify-content:center;height:100vh;margin:0}
  .box{text-align:center;max-width:420px;padding:32px}
  h1{font-size:1.4rem;margin:0 0 8px}
  p{color:#5b6b7b}
  code{font-size:.8rem;color:#8a97a5}
  button{margin-top:16px;padding:10px 22px;border:0;border-radius:8px;background:#1f93ff;
         color:#fff;font-size:1rem;cursor:pointer}
  button:hover{background:#0f7de8}
</style>
</head>
<body>
<div class="box">
  <h1>Não foi possível conectar</h1>
  <p>Verifique sua internet ou se o servidor está no ar.</p>
  <code id="desc"></code><br>
  <button id="retry">Tentar novamente</button>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("desc").textContent = q.get("desc") || "";
  document.getElementById("retry").onclick = () => {
    if (q.get("url")) location.href = q.get("url");
  };
</script>
</body>
</html>
